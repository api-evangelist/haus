description: >-
  Haus publishes a four-tier plan ladder on its pricing page with a full
  feature-comparison matrix, but it publishes NO prices, no currency and no
  billing period for any tier. Every tier's only call to action is "Get a demo".
  The tiers are packaged by capability (channels measurable, sales channels and
  KPIs, geography, which Haus products are included) and by the human services
  attached (strategist, data scientist, MMM specialist) rather than by an API
  quota, request volume or seat count — Haus sells a measurement service, not
  metered API access. No tier mentions an API, API keys, rate limits or
  developer access; the "Integrations" rows describe Haus pulling data IN from
  ad platforms, Shopify/Amazon and customer data warehouses, not an API Haus
  exposes to customers.
