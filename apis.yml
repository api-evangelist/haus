aid: haus
name: Haus
description: Haus is an AI-powered causal marketing measurement platform that helps enterprise brands
  quantify the true incrementality of their advertising spend. The platform runs on-demand geo-based
  incrementality experiments (treatment vs. holdout groups), causal media mix modeling (MMM) grounded
  in experimental data, and daily causal attribution reporting, so marketers can see which channels
  actually drive revenue. Haus reports running thousands of experiments annually across tens of billions
  of dollars in optimized ad spend for customers such as FanDuel, Intuit, Wayfair, and Coursera. Founded
  by former Google economists, Haus is backed by Insight Partners.
