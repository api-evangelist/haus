generated: '2026-08-12'
method: probed
source: >-
  Live HTTP probes of the /.well-known/ discovery surface on every Haus host
  reachable in DNS on 2026-08-12. apis.yml carries no apis[] entries and no
  OpenAPI servers[] exist, so the host set is the marketing host, the customer
  application host and the trust-center host.
description: >-
  Haus serves NO first-party /.well-known/ discovery surface. www.haus.io answers
  every /.well-known/* path with an HTTP 404 carrying a Webflow "Invalid
  .well-known request" HTML body; app.haus.io answers 404 with the Next.js SPA
  error shell. The only 200s on the entire probe are on trust.haus.io, and they
  are NOT Haus documents — see ownership_finding below. No WellKnown or
  SecurityTxt pointer is emitted in apis.yml, because Haus does not publish one.
pointer_emitted: false
pointer_reason: >-
  No path returned a 200 carrying a document that belongs to Haus. Emitting a
  WellKnown pointer here would credit Haus with a discovery surface it does not
  serve.
