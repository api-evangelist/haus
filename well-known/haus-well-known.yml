ownership_finding:
  verdict: third-party
  summary: >-
    The two 200s on trust.haus.io are real, correctly-typed OAuth 2.0
    Authorization Server Metadata documents, but they describe SafeBase's
    hosted MCP server, not any Haus API. Both bodies declare
    issuer "https://app.safebase.io/api/mcp", service_documentation
    "https://docs.safebase.io/mcp", and authorization/token/registration/
    revocation endpoints all under app.safebase.io. trust.haus.io is Haus's
    trust center rendered by SafeBase on a CNAME'd subdomain, so the vendor's
    well-known surface is served under Haus's domain. Judged by what the
    documents say about themselves (STEP 0c), they belong to SafeBase.
  saved_as_evidence: true
  credited_to_haus: false
  pattern: vendor-CNAME well-known false positive
  hosts_affected:
  - trust.haus.io
dns_negative_probes:
  description: >-
    Candidate API/docs hostnames resolved before probing. Every one is NXDOMAIN,
    so there is no API host to probe a /.well-known/ surface on.
  nxdomain:
